name: Manatee
description: Manatee is a digital mental health company delivering family-centered virtual therapy for children,
  teens, and their parents. It pairs licensed therapists with dedicated care navigators to provide evidence-based
  treatment (CBT, DBT, and family-systems therapy) for kids ages 5-18 and counseling for caregivers, coordinated
  through a family app and covered by most major insurance plans across multiple U.S. states. Backed by Techstars,
  Manatee operates as a consumer telehealth service and does not currently publish a public developer API,
  SDKs, or developer documentation; this profile captures its public identity and domain-security posture.
